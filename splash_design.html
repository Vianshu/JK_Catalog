<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>JK Splash Screen</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body{
        width:100vw;
        height:100vh;
        overflow:hidden;
        background:#FFFFFF;
    }

    .window{
        width:100%;
        height:100%;
        position:relative;
        background:#FFFFFF;
    }

    /* MAIN CONTENT */
    .content{
        width:100%;
        height:100%;
        display:flex;
        align-items:center;
        justify-content:center;
        position:relative;
        z-index: 10;
    }

    .center-box{
        text-align:center;
        display:flex;
        flex-direction:column;
        align-items:center;
    }

    .logo{
        width:180px;
        margin-bottom:15px;
    }

    .main-title{
        font-size:42px;
        font-weight:800;
        color:#1F2937;
        letter-spacing:-0.5px;
        margin-bottom: 12px;
    }

    .main-title span{
        color:#0B9B8A; 
    }

    .separator{
        width: 50px;
        height: 3px;
        background-color: #0B9B8A;
        border-radius: 2px;
    }

</style>
</head>

<body>

<div class="window">

    <!-- Center Content -->
    <div class="content">
        <div class="center-box">
            <img src="JK_Icon.ico" class="logo">
        </div>
    </div>

</div>

</body>
</html>
